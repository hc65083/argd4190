<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize your own Poster</title>
</head>
<body>
    <div id="editor">
    <div id="img" class="object"></div>
    <button> Add an image <id="button"></button>
    <label>X <input id="x" type="range" min="-300" max="300"></label>
    <label>Y <input id="y" type="range" min="-300" max="300"></label>
    <label>Scale <input id="scale" type="range" min="0.1" max="3" step="0.1" value="1"></label>
    <label>Skew X <input id="skewX" type="range" min="-45" max="45"></label>
    <label>Skew Y <input id="skewY" type="range" min="-45" max="45"></label>
    </div>

    <style>
        #editor {
            position: relative;
            width: 600px;
            height: 400px;
            border: 1px solid #ccc;
        }

        .object {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center;
            background: red;
            color: white;
            padding: 20px;
        }
    </style>

    <script>
        const object = document.querySelector("#img");

        const controls = {
            x: document.querySelector("#x"),
            y: document.querySelector("#y"),
            scale: document.querySelector("#scale"),
            skewX: document.querySelector("#skewX"),
            skewY: document.querySelector("#skewY")
        };

        function update() {
            object.style.transform = `
            translate(${controls.x.value}px, ${controls.y.value}px)
            scale(${controls.scale.value})
            skew(${controls.skewX.value}deg, ${controls.skewY.value}deg)
            `;
        }

        Object.values(controls).forEach(control => {
            control.addEventListener("input", update);
        });

        update();
    </script>
</body>
</html>
